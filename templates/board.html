{% extends "base.html" %}
{% block content %}
<main class="container-fluid board-page py-4 px-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="display-6 fw-bold mb-0">BOARD</h1>
    <form action="{{ url_for('reset_board') }}" method="post"><button class="btn btn-sm btn-outline-secondary">Reset game</button></form>
  </div>
  <section class="category-grid mb-4">
    {% for category in game.categories %}
      <a href="{{ url_for('category_slide', category_id=category.id, slide_number=1) }}" class="category-tile {{ 'picked' if category.picked }}">
        <span class="small text-uppercase">Category {{ loop.index }}</span>
        <strong>{{ category.name }}</strong>
      </a>
    {% endfor %}
  </section>
  <section class="row g-3 justify-content-center">
    {% for team in game.teams %}
      <div class="col-12 col-md-6">
        <div class="score-card">
          <h2>{{ team.name }}</h2>
          <div class="score-row">
            <form action="{{ url_for('change_score', team_index=loop.index0, change=-1) }}" method="post"><button class="score-button">−</button></form>
            <strong>{{ team.score }}</strong>
            <form action="{{ url_for('change_score', team_index=loop.index0, change=1) }}" method="post"><button class="score-button">+</button></form>
          </div>
        </div>
      </div>
    {% endfor %}
  </section>
</main>
{% endblock %}
